[project]
name = "realestate-rag-agent"
version = "0.1.0"
description = "AI agent for intelligent real-estate search with RAG, GraphRAG and agent orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "sentence-transformers>=3.3",
    "openai>=1.55",
    "torch>=2.2",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.29",
    "langchain-anthropic>=0.3",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyyaml>=6.0",
]

[project.scripts]
realestate-mcp = "realestate_rag_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realestate_rag_agent"]

# On Linux, pull the CPU-only torch build (no ~5 GB CUDA payload). macOS keeps
# the default PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that load the real embedding model (deselect with '-m \"not slow\"')",
]
